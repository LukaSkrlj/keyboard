<h1 mat-dialog-title>Save keyboard layout</h1>
<div mat-dialog-content>
  <mat-form-field>
    <input [formControl]="control" matInput placeholder="Layout name">
  </mat-form-field>
</div>
<div mat-dialog-actions>

  <button (click)="onSave()">Save</button>
  <button mat-dialog-close>Close</button>
</div>
